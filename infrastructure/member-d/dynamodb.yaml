AWSTemplateFormatVersion: '2010-09-09'
Description: Member D database resources retained by PacificBioArchive-Database.

Parameters:
  ReservationsTableArn:
    Type: String
  QueryInputBucketName:
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be an S3 bucket name without wildcard characters.
  StorageDeleteFunctionName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_-]{1,64}$'
    ConstraintDescription: Must be a Lambda function name without an ARN or wildcard.

Resources:
  FilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PacificBioArchiveFiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: file_id
          KeyType: HASH

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PacificBioArchiveSubscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: species
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: species
          KeyType: RANGE

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PacificBioArchiveNotifications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: notification_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: notification_id
          KeyType: RANGE

  QueryLambdaRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: PacificBioArchive-QueryLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBFilesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt FilesTable.Arn
                  - !Ref ReservationsTableArn
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt NotificationsTable.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${QueryInputBucketName}/query-inputs/*
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StorageDeleteFunctionName}

Outputs:
  TableName:
    Value: !Ref FilesTable
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  NotificationsTableName:
    Value: !Ref NotificationsTable
  QueryLambdaRoleArn:
    Value: !GetAtt QueryLambdaRole.Arn
