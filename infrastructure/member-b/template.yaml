AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Private media ingestion and preprocessing boundary for Member B.

Parameters:
  ExistingHttpApiId:
    Type: String
  ExistingJwtAuthorizerId:
    Type: String
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
  MetadataApiBaseUrl:
    Type: String
    AllowedPattern: '^https://(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:/[A-Za-z0-9._~!$&()*+,;=:@%/-]*)?$'
    ConstraintDescription: Must be an HTTPS URL with a valid DNS host and optional path.
  InferenceApiUrl:
    Type: String
    AllowedPattern: '^https://(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)*[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:/[A-Za-z0-9._~!$&()*+,;=:@%/-]*)?$'
    ConstraintDescription: Must be an HTTPS URL with a valid DNS host and optional path.
  InternalApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
  FfmpegLayerArn:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):lambda:[a-z0-9-]+:[0-9]{12}:layer:[A-Za-z0-9_-]+:[1-9][0-9]*$'
    ConstraintDescription: Must be a versioned Lambda Layer ARN.
  MaxUploadBytes:
    Type: Number
    Default: 262144000
  MaxImageUploadBytes:
    Type: Number
    Default: 12582912
  InferenceHttpTimeoutSeconds:
    Type: Number
    Default: 70

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - MediaProcessingInvokePermission
    Properties:
      BucketName: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - Content-Type
              - x-amz-checksum-sha256
            ExposedHeaders:
              - ETag
              - x-amz-checksum-sha256
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedProcessingObjects
            Prefix: processing/
            Status: Enabled
            ExpirationInDays: 1
          - Id: ExpireAbandonedQueryInputs
            Prefix: query-inputs/
            Status: Enabled
            ExpirationInDays: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MediaProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/lambdas/upload/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          UPLOAD_BUCKET: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
          METADATA_API_BASE_URL: !Ref MetadataApiBaseUrl
          INTERNAL_API_KEY: !Ref InternalApiKey
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          MAX_IMAGE_UPLOAD_BYTES: !Ref MaxImageUploadBytes
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/originals/*

  MediaProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/lambdas/media-processing/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 3008
      EphemeralStorage:
        Size: 4096
      Layers:
        - !Ref FfmpegLayerArn
      Environment:
        Variables:
          MEDIA_BUCKET_NAME: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
          METADATA_API_BASE_URL: !Ref MetadataApiBaseUrl
          INFERENCE_API_URL: !Ref InferenceApiUrl
          INTERNAL_API_KEY: !Ref InternalApiKey
          INFERENCE_HTTP_TIMEOUT_SECONDS: !Ref InferenceHttpTimeoutSeconds
          FFMPEG_PATH: /opt/bin/ffmpeg
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/originals/*
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/processing/*
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/thumbnails/*
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/processing/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/processing/*

  MediaProcessingInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MediaProcessingFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}

  StorageDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/lambdas/storage-delete/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          MEDIA_BUCKET_NAME: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/originals/*
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/thumbnails/*
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/processing/*

  AssetUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/lambdas/asset-urls/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          MEDIA_BUCKET_NAME: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
          METADATA_API_BASE_URL: !Ref MetadataApiBaseUrl
          INTERNAL_API_KEY: !Ref InternalApiKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/originals/*
                - !Sub arn:${AWS::Partition}:s3:::pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}/thumbnails/*

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExistingHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: POST /upload-url
      AuthorizationType: JWT
      AuthorizerId: !Ref ExistingJwtAuthorizerId
      Target: !Sub integrations/${UploadIntegration}

  UploadPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: OPTIONS /upload-url
      AuthorizationType: NONE
      Target: !Sub integrations/${UploadIntegration}

  UploadInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingHttpApiId}/*/POST/upload-url

  UploadPreflightInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingHttpApiId}/*/OPTIONS/upload-url

  AssetUrlsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExistingHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AssetUrlsFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'

  AssetUrlsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: POST /asset-urls
      AuthorizationType: JWT
      AuthorizerId: !Ref ExistingJwtAuthorizerId
      Target: !Sub integrations/${AssetUrlsIntegration}

  AssetUrlsPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: OPTIONS /asset-urls
      AuthorizationType: NONE
      Target: !Sub integrations/${AssetUrlsIntegration}

  AssetUrlsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AssetUrlsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingHttpApiId}/*/POST/asset-urls

  AssetUrlsPreflightInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AssetUrlsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingHttpApiId}/*/OPTIONS/asset-urls

Outputs:
  MediaBucketName:
    Value: !Sub pacificbioarchive-media-${AWS::AccountId}-${AWS::Region}
  UploadFunctionArn:
    Value: !GetAtt UploadFunction.Arn
  MediaProcessingFunctionArn:
    Value: !GetAtt MediaProcessingFunction.Arn
  StorageDeleteFunctionArn:
    Value: !GetAtt StorageDeleteFunction.Arn
  StorageDeleteFunctionName:
    Value: !Ref StorageDeleteFunction
  AssetUrlsFunctionArn:
    Value: !GetAtt AssetUrlsFunction.Arn
